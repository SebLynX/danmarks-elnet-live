# Static-site variant, checks only. Deploy is NOT here: update-data.yml publishes the site in
# the same run that commits fresh data, because a commit pushed with GITHUB_TOKEN does not
# start other workflows. A deploy job here would never see the data commits.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks-history scans every commit

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          npm ci
          pip install pre-commit

      - name: Format, lint, secret scan (same hooks as local)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Secret scan, whole history
        run: pre-commit run --hook-stage manual gitleaks-history --all-files

      - name: Browser for smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npx playwright test
