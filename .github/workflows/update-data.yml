# Henter friske tal fra Energinet, committer data.json og udgiver siden igen.
#
# Hvorfor et job overhovedet: api.energidataservice.dk svarer med et TOMT 200 paa
# enhver forespoergsel der baerer en Origin-header - altsaa alt hvad en browser
# sender, fra ethvert domaene, ogsaa "null" fra en fil aabnet fra disken.
# Forespoergsler UDEN Origin faar fulde data. Denne koersel er ikke en browser.
#
# Hvorfor jobbet ogsaa UDGIVER siden: et commit lavet med GITHUB_TOKEN udloeser
# IKKE et Pages-build. Med klassisk gren-udgivelse ville bottens data.json lande
# i repoet, mens den udgivne side blev ved med at servere filen fra sidste gang
# et menneske pushede. Kortet ville se levende ud og vise uger gamle tal.
# Derfor udgives siden i samme koersel, lige efter at data er skrevet.

name: Opdater data

on:
  schedule:
    # hvert 15. minut. GitHub koerer planlagte jobs naar der er ledig kapacitet,
    # typisk 5-30 minutter forsinket - derfor et interval og ikke et klokkeslaet.
    - cron: '*/15 * * * *'
  workflow_dispatch:        # kan altid koeres manuelt fra Actions-fanen
  push:
    branches: [main]

# to koersler maa aldrig skrive data.json samtidig
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write           # committe data.json
  pages: write              # udgive siden
  id-token: write           # kraeves af deploy-pages

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Hentes til RUNNER_TEMP, uden for arbejdstraeet. Saa kan filen laegges
      # paa plads igen efter en reset, og et halvt svar kan aldrig naa at
      # overskrive en god data.json.
      - name: Hent friske tal
        run: |
          node poll.js "$RUNNER_TEMP/data.json"
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/data.json', 'utf8');
            if (raw.length < 200) throw new Error('kun ' + raw.length + ' bytes - udgives ikke');
            const j = JSON.parse(raw);
            const f = j && j.frame;
            if (!f || !f.time || !f.x || !f.p || !Number.isFinite(f.co2))
              throw new Error('felter mangler - udgives ikke');
            const age = (Date.now() - Date.parse(j.measured)) / 60000;
            if (!(age < 180)) throw new Error('maalingen er ' + Math.round(age) + ' min gammel - udgives ikke');
            console.log('ok: ' + f.time + ' DK, ' + Math.round(age) + ' min gammel');
          "

      - name: Commit hvis tallene har aendret sig
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # To koersler kan overlappe - en manuel start oven i en planlagt.
          # Taber man kaploebet, nytter rebase ikke: begge sider har skrevet
          # den samme ene linje i data.json, saa det giver altid en konflikt.
          # For en genereret fil er svaret i stedet: tag den nyeste remote som
          # udgangspunkt og laeg de friske tal ovenpaa. Ingen konflikt mulig.
          for n in 1 2 3; do
            cp "$RUNNER_TEMP/data.json" data.json

            # stage FOERST og tjek saa indekset: daekker baade "uaendret" og
            # "filen er ikke sporet endnu", som et blankt git diff ikke goer
            git add data.json
            if git diff --cached --quiet; then
              echo "Uaendret."
            else
              git commit -m "Data $(date -u '+%Y-%m-%d %H:%M') UTC"
            fi

            # Hjerteslag: GitHub slaar planlagte koersler fra efter 60 dage uden
            # aktivitet i repoet. Botten committer kun naar tallene aendrer sig,
            # saa en lang flad periode ville lukke jobbet permanent. Et commit
            # hver 20. dag holder det i live - ca. 18 ekstra commits om aaret.
            days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            if [ "$days" -ge 20 ]; then
              date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/sidste-koersel.txt
              git add .github/sidste-koersel.txt
              git commit -m "Hjerteslag (ingen dataaendring i $days dage)"
            fi

            if git diff --quiet HEAD origin/main 2>/dev/null; then
              echo "Intet nyt at pushe."
              exit 0
            fi
            if git push; then exit 0; fi

            echo "push afvist - henter nyeste og laegger tallene ovenpaa ($n/3)"
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "::error::kunne ikke pushe efter 3 forsoeg"
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
