<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TV 2-indslag · Danmarks Elnet</title>
<!--
  The QR code in the map's kiosk mode, and the clip link in its legend card,
  point here rather than at TV 2, so the clip can change without the map
  changing. Set the clip's address in CLIP below; the clip's title is set in
  index.html (CLIP.title), which is also what switches the QR code on.
  While CLIP is empty this page sends people to the map instead.
-->
<script>
const CLIP = '';
if (CLIP) location.replace(CLIP);
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;
  background:#FAF7F2;color:#2B2B2B;font:400 17px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
main{max-width:34rem}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 .6rem}
p{margin:0 0 .9rem;color:#6B5F52}
a{color:#2a78d6;font-weight:600}
</style>
</head>
<body>
<main>
  <h1 id="h">Indslaget er ikke tilgængeligt lige nu</h1>
  <p id="p">Kortet ligger her: <a href="https://el.gridkort.dk/">Danmarks Elnet</a></p>
</main>
<script>
if (CLIP) {
  document.getElementById('h').textContent = 'Videre til TV 2…';
  const p = document.getElementById('p');
  p.textContent = '';
  const a = document.createElement('a');
  a.href = CLIP;
  a.textContent = 'Se indslaget på TV 2';
  p.append(a);
}
</script>
</body>
</html>
